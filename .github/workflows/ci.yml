name: Flutter CI - Format, Analyze and Test

# Manual only: nothing runs on push or pull request. Run this from Actions
# when you want the hosted Flutter checks for the current branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.14.1
    with:
      flutter-channel: stable
      run-format-check: true
      run-analyze: true
      run-tests: true
      build-apk: false
      build-aab: false
